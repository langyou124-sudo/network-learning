name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 先 typegen 再 tsc：本地 tsc 会通过 next-env.d.ts 引用 .next 下生成的
      # 路由类型，CI 没有这些文件，不生成就会漏检路由/页面类型。
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npx eslint src/ --max-warnings=0

      # 课题索引是生成的：新增课题后必须跑 npm run content:index 并提交，
      # 否则 CI 会在这里拦住，避免“加了文件但页面里没有”。
      - name: Content index up to date
        run: node scripts/build-content-index.mjs --check

      - name: Tests
        run: npm test -- --coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
